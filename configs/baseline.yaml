experiment:
  name: dinov3_global_baseline
  seed: 42
  output_dir: outputs/baseline

data:
  train_manifest: outputs/splits/train.csv
  validation_manifest: outputs/splits/val.csv
  image_path_base: .
  image_column: image_path
  label_column: label
  source_column: source
  image_size: 224
  batch_size: 32
  num_workers: 4

model:
  backbone: facebook/dinov3-vitb16-pretrain-lvd1689m
  pretrained: true
  freeze_backbone: true
  revision: null
  feature: cls
  classifier: linear
  hidden_dim: 256
  dropout: 0.0
  num_classes: 2

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
  mixed_precision: true
  pin_memory: true

evaluation:
  threshold: 0.5
  metrics: [auroc, balanced_accuracy, accuracy, f1]
